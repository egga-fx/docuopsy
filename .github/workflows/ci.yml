name: "CI Quality Gate"

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: "Frontend Quality Gate (TypeCheck, Vitest, Probes, Audit & Build)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: TypeScript Static Verification
        run: bun run tsc --noEmit

      - name: Dependency Vulnerability Audit
        run: bun audit

      - name: Vitest Unit & Integration Suite
        run: bun run test

      - name: Production Audit Probes Suite
        run: bunx vitest run --config docs/audits/probes.config.ts

      - name: Production Web Bundle Build
        run: bun run build

  rust:
    name: "Rust Backend Quality Gate (Clippy, Tests & Formatting)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux GUI Dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Rust Formatting Check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy Linter Check (-D warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust Backend Tests Suite
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
