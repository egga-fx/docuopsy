name: "Release Docuopsy"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Publish as draft release"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Publish as prerelease"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: "Pre-Flight Quality Gate (Frontend & Probes)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Frontend Dependencies
        run: bun install

      - name: TypeScript Static Verification
        run: bun run tsc --noEmit

      - name: Vitest Suite & Probes
        run: |
          bun run test
          bunx vitest run --config docs/audits/probes.config.ts

      - name: Web Bundle Build Check
        run: bun run build

  release:
    name: "Build & Publish (${{ matrix.platform }} - ${{ matrix.target }})"
    needs: preflight
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: bun install

      - name: Build and Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Docuopsy ${{ github.ref_name }}"
          releaseBody: |
            ## 🔬 Docuopsy ${{ github.ref_name }} — Production Release

            Forensic-grade desktop text editor & document studio for Windows, Linux, and macOS.

            ### ✨ Key Capabilities & Hardening:
            - **Forensic Themes:** High-contrast archival dark & light vellum palette with WCAG AA compliance
            - **Persistence Engine:** Per-tab atomic disk flush, dirty-tab close guard dialog, and monotonic revision tracking
            - **Document Viewers:** Binary IPC streaming PDF viewer with offline bundled PDF.js worker engine
            - **Dynamic AI Copilot:** Context-aware forensics streaming engine with multi-turn conversation and stream isolation
            - **Native Window Chrome:** Frameless undecorated window with drag grips, inline tab rename, and fluid tab panning
            - **Multi-Platform Support:** Native bundles for Windows (.msi / .exe), Linux (.deb / .AppImage), and macOS (.dmg / .app)
          releaseDraft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
