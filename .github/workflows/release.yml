name: "Release Docuopsy"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: bun install

      - name: Build and Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Docuopsy ${{ github.ref_name }}"
          releaseBody: |
            ## 🔬 Docuopsy ${{ github.ref_name }} — Production Release

            Forensic-grade desktop text editor & document studio for Windows, Linux, and macOS.

            ### ✨ Key Highlights:
            - **Forensics Dark & Light Vellum Systems:** High-contrast archival aesthetic with electric accent (`#7170ff`), Inter Variable typography, and Berkeley Mono accents.
            - **Forensic-Grade Session Persistence:** Atomic state serialization and unsaved scratch draft crash-protection.
            - **Format-Aware Multi-Document Previews:** Real-time Markdown (GFM), PDF viewer (PDF.js), and syntax-highlighted code viewer (`.rs`, `.ts`, `.json`, `.txt`).
            - **Docked AI Assistant:** Context-aware writing and analysis palette with smooth typewriter token streaming, glowing caret, dynamic runtime metadata, and unconstrained user-driven format adaptation.
            - **Universal Cross-Platform Shortcuts:** Native modifier keys (`Ctrl` on Windows/Linux, `Cmd ⌘` on macOS) across all editor and layout operations.

            ### 📦 Binaries & Installers:
            - **Windows (x64):** `Docuopsy_${{ github.ref_name }}_x64-setup.exe` & `.msi`
            - **Linux (x64):** `.deb` & `.AppImage`
            - **macOS (Apple Silicon & Intel):** `.dmg` & `.app.tar.gz`
          releaseDraft: false
          prerelease: false
